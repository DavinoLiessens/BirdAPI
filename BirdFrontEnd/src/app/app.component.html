@if (isAuthenticated) {
  <p-toolbar>
    <div class="p-toolbar-group-left">
      <p-splitbutton label="Vogels" (onClick)="navigateToPage('/birds')" [model]="birdItems" class="button-toolbar" ></p-splitbutton>
      <p-splitbutton label="Koppels" (onClick)="navigateToPage('/couples')" [model]="coupleItems" class="button-toolbar"></p-splitbutton>
      <p-splitbutton label="Contacten" (onClick)="navigateToPage('/contacts')" [model]="contactItems" class="button-toolbar"></p-splitbutton>
    </div>
    <div class="p-toolbar-group-right">
      @if (currentUser) {
        <span class="user-name">
          <i class="pi pi-user"></i> {{ currentUser.fullName }}
        </span>
      }
      <p-button label="Uitloggen" icon="pi pi-sign-out" (onClick)="logout()" styleClass="p-button-text"></p-button>
    </div>
  </p-toolbar>
}

<router-outlet></router-outlet>
